name: Release APK Derle ve Yayınla

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sürüm Kodunu ve Adını Belirle
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          IFS='.' read -r major minor patch <<< "$VERSION_NAME"
          VERSION_CODE=$(( ${major:-1} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "YTU_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "YTU_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: İzin Ver
        run: chmod +x gradlew

      - name: Release APK Derle
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ytu-menu.apk

      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
