name: Release APK Derle ve Yayınla

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sürüm Kodunu ve Adını Belirle
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # v1.0.3 -> 1.0.3
          VERSION_NAME="${TAG_NAME#v}"
          # 1.0.3 -> 10003
          IFS='.' read -r major minor patch <<< "$VERSION_NAME"
          VERSION_CODE=$(( ${major:-1} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "YTU_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "YTU_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Sabit Keystore Çöz
        run: |
          mkdir -p app/build/outputs/apk/release
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          else
            # Varsayılan sabit depo anahtarı (tüm derlemelerin imzası birebir aynı kalsın diye)
            echo '' | base64 --decode > release.jks
          fi
          echo "YTU_KEYSTORE_PATH=../release.jks" >> $GITHUB_ENV
          echo "YTU_KEYSTORE_PASSWORD=ytu123456" >> $GITHUB_ENV
          echo "YTU_KEY_ALIAS=ytumenu" >> $GITHUB_ENV
          echo "YTU_KEY_PASSWORD=ytu123456" >> $GITHUB_ENV

      - name: İzin Ver
        run: chmod +x gradlew

      - name: APK Derle
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/ytu-menu.apk
          fi

      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true


